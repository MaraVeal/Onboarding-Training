<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Understanding Your Fooda Invoice — Fooda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
  // Embedded in the Fooda Pop-Up Trainer: theme is owned by the trainer.
  // It posts {type:"fooda-theme", theme} on toggle; mirror it onto <html>.
  window.addEventListener("message", function (e) {
    var d = e && e.data;
    if (!d || d.type !== "fooda-theme") return;
    if (d.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  });
  </script>
  <script>
  (function(){
    try {
      if (localStorage.getItem('mise_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
    window.miseToggleTheme = function() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) {
        html.removeAttribute('data-theme');
        try { localStorage.setItem('mise_theme', 'light'); } catch (e) {}
      } else {
        html.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('mise_theme', 'dark'); } catch (e) {}
      }
    };
  })();
  </script>
  <style>
    :root {
      --bg-page: #F5F5F6;
      --bg-card: #fff;
      --bg-soft: #FAFAFA;
      --text-default: #222;
      --text-primary: #374053;
      --text-secondary: #737A87;
      --text-muted: #AFB3BA;
      --border: #e4e6ea;
      --border-input: #d7dae0;
      --divider: #eef0f3;
      --color-orange: #F3634A;
      --color-orange-dark: #d94f39;
      --color-green: #18CC9B;
      --color-charcoal: #374053;
      --color-yellow: #FBDB56;
    }
    html[data-theme="dark"] {
      --bg-page: #2f3641;
      --bg-card: #3d4452;
      --bg-soft: #353c48;
      --text-default: #D4D8DE;
      --text-primary: #D4D8DE;
      --text-secondary: #B5BEC9;
      --text-muted: #9AA6B5;
      --border: rgba(255,255,255,0.1);
      --border-input: rgba(255,255,255,0.14);
      --divider: rgba(255,255,255,0.06);
      background-color: #2f3641 !important;
    }
    html[data-theme="dark"] body { background-color: #2f3641 !important; }
    html, body { margin: 0; }

    .mise-tab-root, .mise-tab-root * { box-sizing: border-box; }
    .mise-tab-root {
      font-family: "Quicksand", "Segoe UI", Arial, sans-serif;
      color: var(--text-default);
      background: var(--bg-page);
      padding: 32px 32px 80px;
      min-height: 100vh;
      line-height: 1.45;
      transition: background .2s, color .2s;
    }
    input, button, select, textarea { font-family: inherit; }

    .mise-tab-root .mt-page { max-width: 1180px; margin: 0 auto; }

    /* ── Header ── */
    .mise-tab-root .mt-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; margin-bottom: 28px;
    }
    .mise-tab-root .mt-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--color-orange);
      margin-bottom: 12px;
    }
    .mise-tab-root .mt-eyebrow .mt-eyebrow-sep {
      display: inline-block; margin: 0 8px; color: var(--text-muted); letter-spacing: 0;
    }
    .mise-tab-root .mt-title {
      font-size: 38px; font-weight: 700; color: var(--text-primary);
      line-height: 1.1; margin: 0 0 14px; letter-spacing: -0.5px;
    }
    .mise-tab-root .mt-lede {
      font-size: 15px; color: var(--text-secondary);
      max-width: 720px; margin: 0;
    }
    .mise-tab-root .mt-lede strong { color: var(--text-primary); font-weight: 600; }
    .mise-tab-root .mt-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── Dark mode toggle ── */
    .mt-theme-btn {
      background: transparent; border: 1px solid var(--border-input);
      padding: 8px 10px; cursor: pointer; border-radius: 8px;
      color: var(--text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
      transition: color .15s, background .15s, border-color .15s;
      font-size: 16px; line-height: 1;
    }
    .mt-theme-btn:hover { color: var(--text-primary); border-color: var(--color-orange); }
    .mt-theme-btn .mt-icon-moon { display: inline; }
    .mt-theme-btn .mt-icon-sun  { display: none; }
    html[data-theme="dark"] .mt-theme-btn .mt-icon-moon { display: none; }
    html[data-theme="dark"] .mt-theme-btn .mt-icon-sun  { display: inline; }

    /* ── Block card ── */
    .mise-tab-root .mt-block {
      background: var(--bg-card); border-radius: 12px;
      box-shadow: 0 1px 3px rgba(24, 28, 35, 0.04);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    html[data-theme="dark"] .mise-tab-root .mt-block { box-shadow: 0 1px 6px rgba(0,0,0,0.25); }
    .mise-tab-root .mt-block-head {
      background: #374053; color: #fff;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px;
    }
    html[data-theme="dark"] .mise-tab-root .mt-block-head { background: #2a3140; }
    .mise-tab-root .mt-block-head h2 {
      font-size: 14px; font-weight: 600; margin: 0; color: #fff;
    }
    .mise-tab-root .mt-block-head .mt-block-sub { font-size: 11px; opacity: 0.7; }
    .mise-tab-root .mt-block-body { padding: 0; }

    /* ── Two-column walk layout ── */
    .mise-tab-root .mt-walk {
      display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr);
      min-height: 520px;
    }
    @media (max-width: 880px) {
      .mise-tab-root .mt-walk { grid-template-columns: 1fr; }
    }

    /* ── Stage (invoice viewer) ── */
    .mise-tab-root .mt-stage {
      position: relative;
      background: #1a1f2a;
      padding: 28px 24px;
      display: flex; align-items: center; justify-content: center;
      min-height: 520px;
      overflow: hidden;
    }
    .mise-tab-root .mt-stage-svg {
      display: none; width: 100%; line-height: 0; position: relative;
    }
    .mise-tab-root .mt-stage-svg.active { display: block; }
    .mise-tab-root .mt-stage-svg svg {
      width: 100%; height: auto; display: block;
    }

    /* ── SVG marker styles ── */
    .mt-svg-marker-circle {
      cursor: pointer; transition: transform .15s;
      transform-origin: center; transform-box: fill-box;
    }
    .mt-svg-marker-group { cursor: pointer; }
    .mt-svg-marker-group:hover .mt-svg-marker-circle { transform: scale(1.15); }
    .mt-svg-marker-group .mt-svg-marker-pulse {
      animation: mt-svg-pulse 2.4s infinite;
      transform-origin: center; transform-box: fill-box;
    }
    .mt-svg-marker-group.active .mt-svg-marker-pulse { animation: none; }
    .mt-svg-marker-group.active .mt-svg-marker-circle { fill: #fff; }
    .mt-svg-marker-group.active .mt-svg-marker-text { fill: #F3634A; }
    @keyframes mt-svg-pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 0; transform: scale(2.2); }
    }

    /* ── Target highlight (glows when its marker is active) ── */
    .mt-target { transition: filter .25s; }
    .mt-target.active {
      filter: drop-shadow(0 0 0 #F3634A) drop-shadow(0 0 10px rgba(243,99,74,0.9));
      animation: mt-target-pulse 1.6s ease-in-out infinite;
    }
    @keyframes mt-target-pulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(243,99,74,0.6)); }
      50%       { filter: drop-shadow(0 0 18px rgba(243,99,74,1)); }
    }

    /* ── Connector line ── */
    .mt-connector {
      stroke: #F3634A; stroke-width: 2; fill: none;
      stroke-dasharray: 4 4; opacity: 0.45; transition: opacity .2s;
    }
    .mt-connector.active { opacity: 1; stroke-dasharray: none; stroke-width: 2.5; }

    /* ── Side panel ── */
    .mise-tab-root .mt-side {
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    @media (max-width: 880px) {
      .mise-tab-root .mt-side { border-left: none; border-top: 1px solid var(--border); }
    }
    .mise-tab-root .mt-side-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--divider);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .mise-tab-root .mt-side-step-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--color-orange); margin-bottom: 4px;
    }
    .mise-tab-root .mt-side-step-title {
      font-size: 16px; font-weight: 700; color: var(--text-primary); margin: 0;
    }
    .mise-tab-root .mt-side-close {
      background: transparent; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 16px; padding: 4px 6px;
      border-radius: 6px; line-height: 1;
    }
    .mise-tab-root .mt-side-close:hover { color: var(--color-orange); background: var(--bg-soft); }
    .mise-tab-root .mt-side-body {
      padding: 18px 20px; flex: 1; display: flex; flex-direction: column;
    }
    .mise-tab-root .mt-side-counter {
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
      color: var(--text-muted); margin-bottom: 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .mise-tab-root .mt-side-counter .mt-counter-num {
      color: var(--color-orange); font-size: 13px;
    }
    .mise-tab-root .mt-side-instruction {
      font-size: 14px; color: var(--text-default); line-height: 1.6;
      margin: 0; flex: 1;
    }
    .mise-tab-root .mt-side-instruction p { margin: 0 0 10px; }
    .mise-tab-root .mt-side-instruction p:last-child { margin-bottom: 0; }
    .mise-tab-root .mt-side-instruction ul {
      margin: 8px 0; padding-left: 18px;
    }
    .mise-tab-root .mt-side-instruction li { margin-bottom: 5px; }

    /* ── Step nav ── */
    .mise-tab-root .mt-side-nav {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 12px 20px 18px;
      border-top: 1px solid var(--divider);
    }
    .mise-tab-root .mt-btn {
      padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all .15s;
      border: 1px solid transparent; white-space: nowrap;
    }
    .mise-tab-root .mt-btn-primary {
      background: var(--color-orange); color: #fff; border-color: var(--color-orange);
    }
    .mise-tab-root .mt-btn-primary:hover { background: var(--color-orange-dark); border-color: var(--color-orange-dark); }
    .mise-tab-root .mt-btn-ghost {
      background: var(--bg-card); color: var(--text-primary); border-color: var(--border-input);
    }
    .mise-tab-root .mt-btn-ghost:hover { border-color: var(--color-orange); color: var(--color-orange); }
    .mise-tab-root .mt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .mise-tab-root .mt-btn:disabled:hover {
      border-color: var(--border-input); color: var(--text-primary); background: var(--bg-card);
    }

    /* ── Page nav pills (below block) ── */
    .mise-tab-root .mt-page-nav {
      display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
    }
    .mise-tab-root .mt-page-pill {
      padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border-input);
      background: var(--bg-card); color: var(--text-secondary);
      transition: all .15s;
    }
    .mise-tab-root .mt-page-pill:hover { border-color: var(--color-orange); color: var(--color-orange); }
    .mise-tab-root .mt-page-pill.active {
      background: var(--color-orange); color: #fff; border-color: var(--color-orange);
    }

    /* ── Glossary section ── */
    .mise-tab-root .mt-glossary {
      margin-top: 28px;
    }
    .mise-tab-root .mt-glossary-head {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-secondary);
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .mise-tab-root .mt-glossary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
      background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    @media (max-width: 800px) {
      .mise-tab-root .mt-glossary-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .mise-tab-root .mt-gl-item {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .mise-tab-root .mt-gl-item:nth-child(4n) { border-right: none; }
    .mise-tab-root .mt-gl-item:nth-last-child(-n+4) { border-bottom: none; }
    .mise-tab-root .mt-gl-term {
      font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;
    }
    .mise-tab-root .mt-gl-def {
      font-size: 12px; color: var(--text-secondary); line-height: 1.5;
    }

    /* ── Footer ── */
    .mise-tab-root .mt-footer {
      margin-top: 36px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
  </style>
</head>
<body>

            <!-- Page 2: Event Invoice (per-event fee breakdown) -->
            <div class="mt-stage-svg" id="mt-stage-1">
              <svg viewBox="0 0 820 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

          text: "Four fee lines are subtracted from your card total:<ul><li><strong>In-person processing:</strong> 1.75% on card payments + $0.25 per order</li><li><strong>Online/mobile processing:</strong> 3.5% on those payments + $0.15 per order</li><li><strong>Commission &amp; event fee:</strong> your agreed rate on food sales after refunds, plus a flat $5.00 event fee</li><li><strong>Sales tax:</strong> passed through to the tax authority — not a cost to you</li></ul>Every line shows the rate and the dollar base so you can verify every charge."
        },
        {
          mx: 780, my: 494,
          tx: 748, ty: 494,
          text: "The bold <strong>DUE TO SAMPLE RESTAURANT</strong> line is your payout for this specific event. This should match the total in the events table on page 1. If you have multiple events in the billing period, there's one of these pages per event — and they all add up to your deposit."
        }
      ]
    },
    {
      num: 3,
      eyebrow: "Page 3 · Reconciliation",
      title: "The sales check",
      stageId: "mt-stage-2",
      markers: [
        {
          mx: 48, my: 430,
          tx: 110, ty: 416,
          text: "The <strong>Sales column</strong> is the menu side: what was sold. It adds <strong>food sales + tax = Gross Food Sales</strong>. The food sales figure here is the same number your commission on page 2 was calculated against."
        },
        {
          mx: 780, my: 430,
          tx: 730, ty: 416,
          text: "The <strong>Payments column</strong> is the till side: how it was paid. It adds <strong>cash collected + cards collected = Gross Food Sales</strong>. Cash appears here even though it doesn't flow through the deposit — this reconciliation accounts for every dollar."
        },
        {
          mx: 420, my: 540,
          tx: 420, ty: 500,
          text: "Both <strong>Gross Food Sales</strong> totals must match. When they do, the event reconciles cleanly. If you ever see a discrepancy, contact your Fooda account manager with the <strong>section reference number (NV#)</strong> and it will be corrected."
        }
      ]
    }
  ];

  // ── Flatten all markers into a linear sequence ──
  const SEQUENCE = [];
  STEPS.forEach((step, sIdx) => {
    step.markers.forEach((m, mIdx) => {
      SEQUENCE.push({ stepIndex: sIdx, markerIndex: mIdx, stageId: step.stageId,
        eyebrow: step.eyebrow, title: step.title, mx: m.mx, my: m.my, text: m.text });
    });
  });

  let currentSeqIndex = -1;
  const SVG_NS = "http://www.w3.org/2000/svg";

  // ── Inject markers + connector lines into each step's SVG ──
  STEPS.forEach((step, sIdx) => {
    const stage = document.getElementById(step.stageId);
    if (!stage) return;
    const svg = stage.querySelector('svg');
    if (!svg) return;
    step.markers.forEach((m, mIdx) => {
      // Connector line
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', m.mx); line.setAttribute('y1', m.my);
      line.setAttribute('x2', m.tx); line.setAttribute('y2', m.ty);
      line.setAttribute('class', 'mt-connector');
      line.setAttribute('data-step', sIdx);
      line.setAttribute('data-marker', mIdx);
      svg.appendChild(line);

      // Marker group: pulse + circle + number
      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('class', 'mt-svg-marker-group');
      g.setAttribute('data-step', sIdx);
      g.setAttribute('data-marker', mIdx);
      g.setAttribute('transform', `translate(${m.mx}, ${m.my})`);

      const pulse = document.createElementNS(SVG_NS, 'circle');
      pulse.setAttribute('cx', 0); pulse.setAttribute('cy', 0);
      pulse.setAttribute('r', 20); pulse.setAttribute('fill', '#F3634A');
      pulse.setAttribute('class', 'mt-svg-marker-pulse');
      g.appendChild(pulse);

      const ring = document.createElementNS(SVG_NS, 'circle');
      ring.setAttribute('cx', 0); ring.setAttribute('cy', 0);
      ring.setAttribute('r', 20); ring.setAttribute('fill', '#F3634A');
      ring.setAttribute('stroke', '#fff'); ring.setAttribute('stroke-width', '3');
      ring.setAttribute('class', 'mt-svg-marker-circle');
      g.appendChild(ring);

      const txt = document.createElementNS(SVG_NS, 'text');
      txt.setAttribute('x', 0); txt.setAttribute('y', 7);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-family', 'Quicksand');
      txt.setAttribute('font-size', 16);
      txt.setAttribute('font-weight', 700);
      txt.setAttribute('fill', '#fff');
      txt.setAttribute('class', 'mt-svg-marker-text');
      txt.setAttribute('pointer-events', 'none');
      txt.textContent = mIdx + 1;
      g.appendChild(txt);

      g.addEventListener('click', () => {
        const seqIdx = SEQUENCE.findIndex(s => s.stepIndex === sIdx && s.markerIndex === mIdx);
        if (seqIdx >= 0) goToSeqIndex(seqIdx);
      });
      svg.appendChild(g);
    });
  });

  function showStage(stepIdx) {
    document.querySelectorAll('.mt-stage-svg').forEach(s => s.classList.remove('active'));
    const stage = document.getElementById(STEPS[stepIdx].stageId);
    if (stage) stage.classList.add('active');
  }

  function setActive(stepIdx, markerIdx) {
    document.querySelectorAll('.mt-svg-marker-group').forEach(g => g.classList.remove('active'));
    document.querySelectorAll('.mt-target').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mt-connector').forEach(c => c.classList.remove('active'));
    const stage = document.getElementById(STEPS[stepIdx].stageId);
    if (!stage) return;
    const g = stage.querySelector(`.mt-svg-marker-group[data-step="${stepIdx}"][data-marker="${markerIdx}"]`);
    if (g) g.classList.add('active');
    const t = stage.querySelector(`.mt-target[data-target="${markerIdx}"]`);
    if (t) t.classList.add('active');
    const c = stage.querySelector(`.mt-connector[data-step="${stepIdx}"][data-marker="${markerIdx}"]`);
    if (c) c.classList.add('active');
  }

  function goToSeqIndex(idx) {
    if (idx < 0 || idx >= SEQUENCE.length) return;
    const prev = currentSeqIndex;
    currentSeqIndex = idx;
    const cur = SEQUENCE[idx];
    if (prev < 0 || SEQUENCE[prev].stepIndex !== cur.stepIndex) {
      showStage(cur.stepIndex);
      // Update page pills
      document.querySelectorAll('.mt-page-pill').forEach(p => {
        p.classList.toggle('active', parseInt(p.dataset.stepIdx) === cur.stepIndex);
      });
    }
    setActive(cur.stepIndex, cur.markerIndex);

    document.getElementById('mt-side-step-tag').textContent = cur.eyebrow;
    document.getElementById('mt-side-step-title').textContent = cur.title;
    document.getElementById('mt-counter-num').textContent = `${idx + 1} / ${SEQUENCE.length}`;
    document.getElementById('mt-side-instruction').innerHTML = `<p style="margin:0;">${cur.text}</p>`;

    document.getElementById('mt-prev').disabled = (idx === 0);
    document.getElementById('mt-next').textContent = (idx === SEQUENCE.length - 1) ? 'Done ✓' : 'Next →';
  }

  function jumpToStep(stepIdx) {
    const seqIdx = SEQUENCE.findIndex(s => s.stepIndex === stepIdx);
    if (seqIdx >= 0) {
      goToSeqIndex(seqIdx);
      document.querySelector('.mt-block').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function resetWalkthrough() {
    currentSeqIndex = -1;
    showStage(0);
    document.querySelectorAll('.mt-svg-marker-group').forEach(g => g.classList.remove('active'));
    document.querySelectorAll('.mt-target').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mt-connector').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.mt-page-pill').forEach((p, i) => p.classList.toggle('active', i === 0));
    document.getElementById('mt-side-step-tag').textContent = 'Walkthrough';
    document.getElementById('mt-side-step-title').textContent = 'Click any marker to begin';
    document.getElementById('mt-counter-num').textContent = '— / —';
    document.getElementById('mt-side-instruction').innerHTML = `
      <span class="mt-side-empty-arrow">↘</span>
      <p class="mt-side-empty-title" style="margin:0 0 6px;">Click any orange marker on the invoice.</p>
      <p style="margin:0; color:var(--text-secondary);">The relevant section will light up and the explanation will appear here. Or hit <strong>Next</strong> to step through in order.</p>
    `;
    document.getElementById('mt-prev').disabled = true;
    document.getElementById('mt-next').textContent = 'Start →';
  }

  document.getElementById('mt-next').addEventListener('click', () => {
    if (currentSeqIndex === -1) goToSeqIndex(0);
    else if (currentSeqIndex < SEQUENCE.length - 1) goToSeqIndex(currentSeqIndex + 1);
    else resetWalkthrough();
  });
  document.getElementById('mt-prev').addEventListener('click', () => {
    if (currentSeqIndex > 0) goToSeqIndex(currentSeqIndex - 1);
  });
  document.getElementById('mt-side-close').addEventListener('click', resetWalkthrough);

  // Page pill jump buttons
  document.querySelectorAll('.mt-page-pill').forEach(p => {
    p.addEventListener('click', () => jumpToStep(parseInt(p.dataset.stepIdx)));
  });

  document.addEventListener('keydown', (e) => {
    const block = document.querySelector('.mt-block');
    const rect = block.getBoundingClientRect();
    const inView = rect.top < window.innerHeight && rect.bottom > 0;
    if (!inView) return;
    if (e.key === 'ArrowRight') document.getElementById('mt-next').click();
    else if (e.key === 'ArrowLeft') document.getElementById('mt-prev').click();
    else if (e.key === 'Escape') resetWalkthrough();
  });

  resetWalkthrough();
</script>

</body>
</html>
